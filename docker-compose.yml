services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: echome-worker:latest
    container_name: echome-worker
    env_file:
      - ./deployment/.env

    volumes:
      - ./deployment:/ECHOME/deployment

    command: celery -A ECHOME worker -l info
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  beat:
    image: echome-worker:latest
    container_name: echome-beat
    env_file:
      - ./deployment/.env
    command: celery -A ECHOME beat -l info --schedule=/var/lib/celery/celerybeat-schedule
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - beat_data:/var/lib/celery
    

  redis:
    image: redis:7-alpine
    container_name: echome-redis
    env_file:
      - ./deployment/.env
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
      - ./deployment:/ECHOME/deployment
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  beat_data: