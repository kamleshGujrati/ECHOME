{% extends "base.html" %}
{% load static %}

{% block title %}Send Message{% endblock %}

{% block extra_css %}
<style>
    /* Additional form‑specific styles */
    .status-message {
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
        display: none;
    }
    .status-message.success {
        background: #d4edda;
        color: #155724;
        display: block;
    }
    .status-message.error {
        background: #f8d7da;
        color: #721c24;
        display: block;
    }
    #loadingOverlay {
        position: fixed;
        inset: 0;
        background: rgba(255,255,255,0.8);
        z-index: 999;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        backdrop-filter: blur(3px);
    }
    #loadingOverlay.active { display: flex; }
    #confetti {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        overflow: hidden;
        z-index: 1000;
        display: none;
    }
    #recordBtn {
        background: #2563eb;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
    }
    #recordBtn:hover { background: #1d4ed8; }
</style>
{% endblock %}

{% block content %}
<h1>Send a Message</h1>

<form id="timeCapsuleForm">
    {% csrf_token %}

    <div>
        <label for="inputType">Message Type</label>
        <select id="inputType" name="inputType">
            <option value="text">Text</option>
            <option value="audio">Audio</option>
        </select>
    </div>

    <div id="textInputContainer">
        <label for="textMessage">Message</label>
        <textarea id="textMessage" name="textMessage" rows="5"></textarea>
    </div>

    <div id="audioInputContainer" style="display:none;">
        <button type="button" id="recordBtn">Start Recording</button>
        <audio id="audioPlayback" controls style="display:none;"></audio>
        <input type="hidden" id="audioData" name="audioData">
    </div>

    <div>
        <label for="timeSelect">Unlock Time</label>
        <select id="timeSelect" name="timeSelect">
            <option value="31536000">1 Year</option>
            <option value="157680000">5 Years</option>
            <option value="custom">Custom</option>
        </select>
    </div>

    <div id="customDatetimeContainer" style="display:none;">
        <input type="datetime-local" id="customDatetime" name="customDatetime">
    </div>

    <div>
        <label for="email">Recipient Email</label>
        <input type="email" id="email" name="email" required>
    </div>

    <button type="submit" id="submitBtn">Send</button>
</form>

<!-- UI feedback elements -->
<div id="statusMessage" class="status-message"></div>
<div id="loadingOverlay">Sealing your capsule…</div>
<div id="confetti"></div>
{% endblock %}

{% block extra_js %}
<script>
    
    var UPLOAD_URL = "{% url 'process_secure_upload' %}";
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="{% static 'js/validation.js' %}"></script>
<script src="{% static 'js/form.js' %}"></script>
{% endblock %}
