
services:
  worker:
    image: kgpro/echome:latest
    container_name: echome-worker
    env_file:
      - ./.env
    volumes:
      - ./:/app/deployment:ro
    command: celery -A ECHOME worker -l info
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  beat:
    image: kgpro/echome:latest
    container_name: echome-beat
    env_file:
      - ./.env
    volumes:
      - ./:/app/deployment:ro
      - beat_data:/var/lib/celery
    command: celery -A ECHOME beat -l info --schedule=/var/lib/celery/celerybeat-schedule
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: echome-redis
    env_file:
      - ./redis.env
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data

    ports:
      - "6379:6379"

    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
      
volumes:
  redis_data:
  beat_data:

